<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Multi-Agent Research System</title>
  <desc id="desc">Four agents research a topic on the web, write a report, and review it. Agents: search, reader, writer, critic. Built with LangChain, Google Gemini, Tavily Search and Streamlit.</desc>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
  </style>

  <rect x="1" y="1" width="488" height="298" rx="18" fill="#000000" stroke="#2A2A2A" stroke-width="1.5"/>

  <text x="28" y="44" class="sans" font-size="14" fill="#F0B429">Multi-agent workflow</text>
  <text x="28" y="82" class="serif" font-size="26" fill="#F5F5F5">Multi-Agent Research System</text>
  <text x="28" y="110" class="sans" font-size="14" fill="#A8A8A8">Four agents research a topic on the web, write a</text>
  <text x="28" y="130" class="sans" font-size="14" fill="#A8A8A8">structured report, and review it for quality.</text>

  <line x1="74" y1="182" x2="404" y2="182" stroke="#2A2A2A" stroke-width="1.5"/>

  <g class="sans" font-size="13" text-anchor="middle">
    <rect x="28" y="160" width="92" height="44" rx="10" fill="#000000" stroke="#5C4A1A"/><text x="74" y="187" fill="#F5F5F5">Search</text>
    <rect x="138" y="160" width="92" height="44" rx="10" fill="#000000" stroke="#5C4A1A"/><text x="184" y="187" fill="#F5F5F5">Reader</text>
    <rect x="248" y="160" width="92" height="44" rx="10" fill="#000000" stroke="#5C4A1A"/><text x="294" y="187" fill="#F5F5F5">Writer</text>
    <rect x="358" y="160" width="92" height="44" rx="10" fill="#000000" stroke="#5C4A1A"/><text x="404" y="187" fill="#F5F5F5">Critic</text>

    <g opacity="0">
      <rect x="28" y="160" width="92" height="44" rx="10" fill="#F0B429"/><text x="74" y="187" fill="#000000">Search</text>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.25" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="138" y="160" width="92" height="44" rx="10" fill="#F0B429"/><text x="184" y="187" fill="#000000">Reader</text>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="248" y="160" width="92" height="44" rx="10" fill="#F0B429"/><text x="294" y="187" fill="#000000">Writer</text>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="358" y="160" width="92" height="44" rx="10" fill="#F0B429"/><text x="404" y="187" fill="#000000">Critic</text>
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.75" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
  </g>

  <g class="sans" font-size="13" fill="#E8C766" text-anchor="middle">
    <rect x="28" y="244" width="88" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="72" y="261.5">LangChain</text>
    <rect x="126" y="244" width="70" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="161" y="261.5">Gemini</text>
    <rect x="206" y="244" width="66" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="239" y="261.5">Tavily</text>
    <rect x="282" y="244" width="80" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="322" y="261.5">Streamlit</text>
  </g>
</svg>
