  <title id="title">Skills and tools</title>
  <desc id="desc">Language: Python, Object oriented programming. Backend: FastAPI, REST APIs, Pydantic, SQLAlchemy, Uvicorn. AI and LLM: LangChain, LangGraph, RAG, Embeddings, Similarity search, Prompt engineering. Data: PostgreSQL, Neon, ChromaDB, Alembic. Tools: Git, GitHub, VS Code, Postman, Streamlit, Brevo. A mix of tools used in projects and tools still being learned.</desc>
