<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">RAG Website Chatbot</title>
  <desc id="desc">Turns a website into a searchable knowledge base and answers questions with retrieved context through a custom chat widget. Pipeline: website, chunks, vectors, answer. Built with FastAPI, ChromaDB and embeddings.</desc>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
  </style>

  <rect x="1" y="1" width="488" height="298" rx="18" fill="#000000" stroke="#2A2A2A" stroke-width="1.5"/>

  <text x="28" y="44" class="sans" font-size="14" fill="#F0B429">Retrieval augmented generation</text>
  <text x="28" y="82" class="serif" font-size="26" fill="#F5F5F5">RAG Website Chatbot</text>
  <text x="28" y="110" class="sans" font-size="14" fill="#A8A8A8">Turns a website into a searchable knowledge base</text>
  <text x="28" y="130" class="sans" font-size="14" fill="#A8A8A8">and answers with retrieved context in a chat widget.</text>

  <line x1="120" y1="182" x2="358" y2="182" stroke="#2A2A2A" stroke-width="1.5"/>

  <g class="sans" font-size="13" text-anchor="middle">
    <rect x="28" y="160" width="92" height="44" rx="10" fill="#000000" stroke="#5C4A1A"/><text x="74" y="187" fill="#F5F5F5">Website</text>
    <rect x="138" y="160" width="92" height="44" rx="10" fill="#000000" stroke="#5C4A1A"/><text x="184" y="187" fill="#F5F5F5">Chunks</text>
    <rect x="248" y="160" width="92" height="44" rx="10" fill="#000000" stroke="#5C4A1A"/><text x="294" y="187" fill="#F5F5F5">Vectors</text>
    <rect x="358" y="160" width="92" height="44" rx="10" fill="#F0B429"/><text x="404" y="187" fill="#000000">Answer</text>
  </g>

  <circle r="4" fill="#F0B429">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M120 182 H358"/>
  </circle>
  <circle r="4" fill="#F0B429" opacity="0.55">
    <animateMotion dur="2.6s" begin="0.87s" repeatCount="indefinite" path="M120 182 H358"/>
  </circle>
  <circle r="4" fill="#F0B429" opacity="0.3">
    <animateMotion dur="2.6s" begin="1.73s" repeatCount="indefinite" path="M120 182 H358"/>
  </circle>

  <g class="sans" font-size="13" fill="#E8C766" text-anchor="middle">
    <rect x="28" y="244" width="77" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="66.5" y="261.5">FastAPI</text>
    <rect x="115" y="244" width="85" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="157.5" y="261.5">ChromaDB</text>
    <rect x="210" y="244" width="98" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="259" y="261.5">Embeddings</text>
  </g>
</svg>
