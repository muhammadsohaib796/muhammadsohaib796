<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Muhammad Sohaib</title>
  <desc id="desc">AI undergraduate building backend services and LLM applications. Open to internships and junior roles.</desc>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .rule { stroke-dasharray: 920; stroke-dashoffset: 920; animation: draw 1.8s ease-out 0.3s forwards; }
    .fade { opacity: 0; animation: fade 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.9s; } .d3 { animation-delay: 1.3s; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .rule { animation: none; stroke-dashoffset: 0; }
      .fade { animation: none; opacity: 1; }
      .dot { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="998" height="228" rx="18" fill="#000000" stroke="#5C4A1A" stroke-width="1.5"/>

  <text x="40" y="56" class="sans fade d1" font-size="15" fill="#BFA35A">BS Artificial Intelligence at BBSUL, Karachi</text>

  <g class="fade d1">
    <rect x="694" y="30" width="266" height="36" rx="18" fill="#000000" stroke="#5C4A1A"/>
    <circle class="dot" cx="716" cy="48" r="5" fill="#F0B429"/>
    <text x="730" y="53" class="sans" font-size="13.5" fill="#F5F5F5">Open to internships and junior roles</text>
  </g>

  <text x="40" y="124" class="serif fade d1" font-size="56" fill="#F5F5F5">Muhammad Sohaib</text>

  <line class="rule" x1="40" y1="148" x2="960" y2="148" stroke="#F0B429" stroke-width="1.5"/>

  <text x="40" y="188" class="sans fade d2" font-size="20" fill="#F0B429">AI undergraduate building backend services and LLM applications</text>
  <text x="40" y="212" class="sans fade d3" font-size="14" fill="#8A8A8A">Python, FastAPI, LangChain and LangGraph. Based in Karachi, open to remote work.</text>
</svg>
