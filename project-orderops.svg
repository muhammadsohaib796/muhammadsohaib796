<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">OrderOps AI</title>
  <desc id="desc">Autonomous order triage and resolution agent. Workflow: fraud check, inventory check, negotiate an alternative by email, pause until the customer replies, then finalize as fulfilled or refunded. Built with FastAPI, LangGraph, PostgreSQL, SQLAlchemy, Alembic and Brevo.</desc>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
  </style>

  <rect x="1" y="1" width="998" height="298" rx="18" fill="#000000" stroke="#2A2A2A" stroke-width="1.5"/>

  <text x="36" y="44" class="sans" font-size="14" fill="#F0B429">Featured project, live demo available</text>
  <text x="36" y="86" class="serif" font-size="34" fill="#F5F5F5">OrderOps AI</text>
  <text x="36" y="118" class="sans" font-size="16" fill="#A8A8A8">Resolves out-of-stock orders on its own: it scores risk, checks stock, emails the customer</text>
  <text x="36" y="140" class="sans" font-size="16" fill="#A8A8A8">an alternative product, and pauses until they accept or decline.</text>

  <line x1="116" y1="205" x2="876" y2="205" stroke="#2A2A2A" stroke-width="1.5"/>

  <g class="sans" text-anchor="middle">
    <rect x="36" y="176" width="160" height="58" rx="10" fill="#000000" stroke="#5C4A1A"/>
    <text x="116" y="202" font-size="14" fill="#F5F5F5">Fraud check</text>
    <text x="116" y="221" font-size="11.5" fill="#8A8A8A">rule-based risk score</text>

    <rect x="226" y="176" width="160" height="58" rx="10" fill="#000000" stroke="#5C4A1A"/>
    <text x="306" y="202" font-size="14" fill="#F5F5F5">Inventory check</text>
    <text x="306" y="221" font-size="11.5" fill="#8A8A8A">stock for every item</text>

    <rect x="416" y="176" width="160" height="58" rx="10" fill="#000000" stroke="#5C4A1A"/>
    <text x="496" y="202" font-size="14" fill="#F5F5F5">Negotiate</text>
    <text x="496" y="221" font-size="11.5" fill="#8A8A8A">offer sent by email</text>

    <rect x="606" y="176" width="160" height="58" rx="10" fill="#000000" stroke="#5C4A1A" stroke-dasharray="5 4"/>
    <text x="686" y="202" font-size="14" fill="#F5F5F5">Await reply</text>
    <text x="686" y="221" font-size="11.5" fill="#8A8A8A">paused in Postgres</text>

    <rect x="796" y="176" width="160" height="58" rx="10" fill="#000000" stroke="#5C4A1A"/>
    <text x="876" y="202" font-size="14" fill="#F5F5F5">Finalize</text>
    <text x="876" y="221" font-size="11.5" fill="#8A8A8A">fulfil or refund</text>

    <g opacity="0">
      <rect x="36" y="176" width="160" height="58" rx="10" fill="#F0B429"/>
      <text x="116" y="202" font-size="14" fill="#000000">Fraud check</text>
      <text x="116" y="221" font-size="11.5" fill="#3D2E05">rule-based risk score</text>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.2" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="226" y="176" width="160" height="58" rx="10" fill="#F0B429"/>
      <text x="306" y="202" font-size="14" fill="#000000">Inventory check</text>
      <text x="306" y="221" font-size="11.5" fill="#3D2E05">stock for every item</text>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.4" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="416" y="176" width="160" height="58" rx="10" fill="#F0B429"/>
      <text x="496" y="202" font-size="14" fill="#000000">Negotiate</text>
      <text x="496" y="221" font-size="11.5" fill="#3D2E05">offer sent by email</text>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.6" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="606" y="176" width="160" height="58" rx="10" fill="#F0B429"/>
      <text x="686" y="202" font-size="14" fill="#000000">Await reply</text>
      <text x="686" y="221" font-size="11.5" fill="#3D2E05">paused in Postgres</text>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.8" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="796" y="176" width="160" height="58" rx="10" fill="#F0B429"/>
      <text x="876" y="202" font-size="14" fill="#000000">Finalize</text>
      <text x="876" y="221" font-size="11.5" fill="#3D2E05">fulfil or refund</text>
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.8" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
  </g>

  <g class="sans" font-size="13" fill="#E8C766" text-anchor="middle">
    <rect x="36" y="252" width="77" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="74.5" y="269.5">FastAPI</text>
    <rect x="123" y="252" width="92" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="169" y="269.5">LangGraph</text>
    <rect x="225" y="252" width="100" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="275" y="269.5">PostgreSQL</text>
    <rect x="335" y="252" width="100" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="385" y="269.5">SQLAlchemy</text>
    <rect x="445" y="252" width="77" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="483.5" y="269.5">Alembic</text>
    <rect x="532" y="252" width="62" height="26" rx="13" fill="none" stroke="#5C4A1A"/><text x="563" y="269.5">Brevo</text>
  </g>
</svg>
